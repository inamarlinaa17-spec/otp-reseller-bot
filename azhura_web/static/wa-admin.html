<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin WA Ready To Use</title><style>body{background:#081321;color:#eef6ff;font:15px system-ui;padding:18px}.wrap{max-width:850px;margin:auto}.card{background:#14263d;border:1px solid #34516e;border-radius:16px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}input{padding:11px;background:#09192a;color:white;border:1px solid #34516e;border-radius:9px}.btn{padding:10px;background:#0879dc;color:white;border:0;border-radius:9px}.item{padding:10px;border-bottom:1px solid #34516e}</style><div class="wrap"><a href="/" style="color:#6bd7ff">← Kembali</a><h1>Admin · WhatsApp Ready To Use</h1><div class="card"><h2>Tambah stok</h2><div class="grid"><input id="flag" value="🇮🇩" placeholder="Bendera"><input id="country" placeholder="Negara"><input id="phone" placeholder="Nomor internasional"><input id="price" type="number" placeholder="Harga jual"></div><p><button class="btn" onclick="add()">Tambah nomor</button></p></div><div class="card"><h2>Stok</h2><div id="stock"></div></div><div class="card"><h2>Pesanan</h2><p>Permintaan kode dikirim melalui tombol Telegram pada notifikasi admin.</p><div id="orders"></div></div></div><script>let csrf='';const $=x=>document.getElementById(x),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(u,o={}){let r=await fetch(u,{credentials:'same-origin',...o,headers:{'Content-Type':'application/json','X-CSRF-Token':csrf,...o.headers}}),d=await r.json();if(!r.ok)throw Error(d.error||'Gagal');return d}async function init(){try{let m=await api('/api/me');csrf=m.csrf;if(!m.is_admin)throw Error('Login sebagai admin.');await refresh()}catch(x){document.body.innerHTML=e(x.message)}}async function add(){try{await api('/api/admin/wa/stock',{method:'POST',body:JSON.stringify({flag:$('flag').value,country:$('country').value,phone:$('phone').value,price:$('price').value})});await refresh();alert('Stok ditambahkan')}catch(x){alert(x.message)}}async function toggle(id,active){try{await api('/api/admin/wa/stock/'+id,{method:'POST',body:JSON.stringify({active})});await refresh()}catch(x){alert(x.message)}}async function refresh(){let s=await api('/api/admin/wa/stock');$('stock').innerHTML=s.items.map(x=>'<div class="item">'+e(x.flag)+' '+e(x.country)+' · '+e(x.phone)+' · Rp'+Number(x.price).toLocaleString('id-ID')+' · '+(x.sold_order_id?'TERJUAL':x.active?'AKTIF':'NONAKTIF')+(!x.sold_order_id?'<button class="btn" onclick="toggle('+x.id+','+(!x.active)+')">Ubah status</button>':'')+'</div>').join('')||'Belum ada stok';let o=await api('/api/admin/wa/orders');$('orders').innerHTML=o.items.map(x=>'<div class="item">'+e(x.order_id)+' · '+e(x.country)+' '+e(x.phone)+' · User '+e(x.telegram_id)+' · '+e(x.status)+(x.otp_code?' · Kode sudah dikirim':'')+'</div>').join('')||'Belum ada pesanan'}init();</script></html>
