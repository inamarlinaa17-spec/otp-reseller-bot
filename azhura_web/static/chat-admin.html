<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081329"><title>AZHURA · Live Chat Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#080f20;color:#eaf3ff;font:15px system-ui,sans-serif}.wrap{max-width:1050px;margin:auto;padding:18px}.card{background:#122440;border:1px solid #294368;border-radius:16px;padding:16px;margin:12px 0}.row{display:flex;gap:12px;flex-wrap:wrap}.users{width:230px;max-width:100%;flex-shrink:0}.chat{flex:1;min-width:260px}.btn,input,textarea{font:inherit;border-radius:10px;padding:11px;border:1px solid #355075;background:#0c1a31;color:white}.btn{cursor:pointer;background:#1459bb}.wide{width:100%}.messages{height:55vh;overflow:auto}.msg{padding:12px;border-radius:12px;background:#1a304f;margin:9px 0;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user{background:#124b8c}.muted{color:#9ab0cd;font-size:12px}a{color:#7dd3fc}
</style></head><body><div class="wrap"><h1>💬 AZHURA ID — Live Chat Admin</h1><p class="muted">Pilih pengguna untuk membaca pesan dan membalas langsung. File maksimum 5 MB.</p><div class="row"><aside class="users card"><h3>Pengguna Chat</h3><div id="users">Memuat…</div></aside><section class="chat card"><div id="title">Pilih pengguna di kiri</div><div id="messages" class="messages"></div><textarea id="message" class="wide" maxlength="3000" placeholder="Tulis balasan admin…"></textarea><input id="file" class="wide" type="file" accept="image/*,.pdf,.txt,.zip,.docx"><button class="btn wide" onclick="send()">Kirim Balasan / File</button><p><a href="/admin">← Kembali ke dashboard admin</a></p></section></div></div><script>
let selected=null,csrf='';const $=id=>document.getElementById(id);async function req(url,opts={}){opts.headers={...(opts.headers||{}),'X-CSRF-Token':csrf};const r=await fetch(url,{credentials:'same-origin',...opts});const d=await r.json();if(!r.ok)throw Error(d.error||'Permintaan gagal');return d}async function loadUsers(){try{const d=await req('/api/chat/messages');$('users').innerHTML=(d.users||[]).map(u=>'<button class="btn wide" style="margin:4px 0" onclick="choose('+u.user_id+')">ID '+u.user_id+'</button>').join('')||'<p class="muted">Belum ada percakapan.</p>'}catch(e){$('users').textContent=e.message}}async function choose(id){selected=id;$('title').textContent='Percakapan pengguna '+id;await loadMessages()}async function loadMessages(){if(selected===null)return;try{const d=await req('/api/chat/messages?user_id='+selected);$('messages').innerHTML=(d.messages||[]).map(m=>'<div class="msg '+(m.sender==='admin'?'':'user')+'"><small>'+m.sender+' · '+new Date(m.created_at).toLocaleString('id-ID')+'</small><div>'+esc(m.message||'')+'</div>'+(m.file_url?'<a href="'+esc(m.file_url)+'" target="_blank">📎 '+esc(m.filename||'Lampiran')+'</a>':'')+'</div>').join('');$('messages').scrollTop=$('messages').scrollHeight}catch(e){$('messages').textContent=e.message}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function send(){if(selected===null){alert('Pilih pengguna dahulu');return}const f=new FormData();f.append('user_id',selected);f.append('message',$('message').value);if($('file').files[0])f.append('file',$('file').files[0]);try{await req('/api/chat/messages',{method:'POST',body:f});$('message').value='';$('file').value='';await loadMessages()}catch(e){alert(e.message)}}req('/api/config').then(d=>{csrf=d.csrf||'';loadUsers();setInterval(()=>{loadUsers();loadMessages()},5000)}).catch(e=>alert(e.message));
</script></body></html>
