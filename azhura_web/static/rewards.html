<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AZHURA • Nonton Iklan</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{background:#0c1526;color:#fff;font:16px system-ui;margin:0;padding:24px}main{max-width:480px;margin:45px auto;background:#192c47;border:1px solid #375578;border-radius:24px;padding:28px;text-align:center}button{background:linear-gradient(100deg,#1476e4,#04b9df);border:0;border-radius:14px;padding:16px 25px;color:white;font-weight:700;font-size:17px;width:100%;cursor:pointer}button:disabled{opacity:.5}.muted{color:#b8c8dc}#message{min-height:70px}</style></head><body><main><h1>🎁 Reward AZHURA</h1><p class="muted">Tonton iklan yang tersedia untuk mendapat saldo bot. Tidak ada batas harian dari AZHURA; ketersediaan iklan ditentukan Monetag.</p><button id="watch" disabled>Nonton Iklan</button><p id="message">Menghubungkan Telegram...</p><p class="muted">Reward diberikan setelah Monetag mengonfirmasi tayangan berbayar. Tayangan yang tidak dibayar tidak menghasilkan saldo.</p></main><script>
let csrf='',zone='',ymid='';const btn=document.getElementById('watch'),msg=document.getElementById('message');const say=t=>msg.textContent=t;
async function api(path,options={}){const r=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},...options});const d=await r.json();if(!r.ok)throw Error(d.error||'Permintaan gagal');return d}
async function init(){try{const tg=window.Telegram?.WebApp;if(tg?.initData){tg.ready();tg.expand();const auth=await api('/api/rewards/login',{method:'POST',body:JSON.stringify({init_data:tg.initData})});csrf=auth.csrf;}else{const auth=await api('/api/me');if(!auth.user)throw Error('Silakan login AZHURA terlebih dahulu');csrf=auth.csrf;}const cfg=await api('/api/rewards/config');if(!cfg.enabled)throw Error(cfg.message);zone=cfg.zone_id;const script=document.createElement('script');script.src='https://libtl.com/sdk.js';script.dataset.zone=zone;script.dataset.sdk='show_'+zone;script.onload=()=>{btn.disabled=false;say('Siap. Tekan tombol untuk menonton iklan.')};script.onerror=()=>say('SDK Monetag tidak dapat dimuat');document.head.appendChild(script)}catch(e){say(e.message)}}
btn.onclick=async()=>{btn.disabled=true;try{const d=await api('/api/rewards/start',{method:'POST',body:'{}'});ymid=d.ymid;const show=window['show_'+zone];if(typeof show!=='function')throw Error('SDK Monetag belum siap');say('Menampilkan iklan...');await show({type:'end',ymid,requestVar:'azhura_reward'});say('Menunggu verifikasi...');for(let i=0;i<15;i++){await new Promise(r=>setTimeout(r,2000));const status=await api('/api/rewards/status/'+ymid);if(status.status==='CREDITED'){say('✅ Reward Rp '+status.reward_idr.toLocaleString('id-ID')+' masuk ke saldo AZHURA!');return}if(status.status==='NO_REWARD'){say('Tayangan ini tidak menghasilkan reward. Silakan coba iklan lain.');return}}say('Menunggu verifikasi... Saldo otomatis masuk setelah tayangan dikonfirmasi.')}catch(e){say('Iklan tidak tersedia atau gagal: '+e.message)}finally{btn.disabled=false}};init();
</script></body></html>
